<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Erasmus Staff Mobility — Diagrams</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#0f1220;color:#eef}
    h1{font-weight:600;margin:0 0 .3em;text-align:center;padding:0 .5em}
    p.sub{opacity:.7;margin:0 0 2em;text-align:center;padding:0 1em}
    .cards{display:flex;gap:1.2em;flex-wrap:wrap;justify-content:center;padding:1em}
    a.card{display:block;width:220px;padding:1.6em 1.2em;border-radius:14px;background:#1b2036;color:#eef;text-decoration:none;border:1px solid #2c3358;transition:transform .12s,border-color .12s}
    a.card:hover{transform:translateY(-4px);border-color:#6ea8ff}
    a.card .n{font-size:1.4em;font-weight:700}
    a.card .d{opacity:.65;font-size:.9em;margin-top:.4em}
  </style>
</head>
<body>
  <h1>Erasmus Staff Mobility — University of Rijeka</h1>
  <p class="sub">Three network visualizations of the same dataset. Pick one:</p>
  <div class="cards">
    <!-- diagram1=Diagram_sebo  diagram2=amra  diagram3=ena-zita_2 -->
    <a class="card" href="../diagram1/"><div class="n">Diagram 1</div><div class="d">Force-directed network</div></a>
    <a class="card" href="../diagram2/"><div class="n">Diagram 2</div><div class="d">Geographic scatter</div></a>
    <a class="card" href="../diagram3/"><div class="n">Diagram 3</div><div class="d">Animated timeline</div></a>
  </div>
</body>
